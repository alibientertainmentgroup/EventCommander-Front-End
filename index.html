<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Command System</title>
    <link rel="stylesheet" href="css/styles.css?v=20260415e">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="manifest" href="./manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#3b82f6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Event CMD">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./icons/icon-16.png">
    <link rel="icon" type="image/x-icon" href="./icons/favicon.ico">
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="login-container">
        <div class="login-box">
            <div class="login-header">
                <div class="login-icon">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                    </svg>
                </div>
                <h1>EVENT COMMAND</h1>
                <p>Mission Planning & Resource Management</p>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label>CAP MEMBER ID</label>
                    <input type="text" id="capIdInput" placeholder="Enter your CAP ID" required>
                </div>
                <div class="form-group">
                    <label>PIN (8 digits)</label>
                    <input type="password" id="capPinInput" placeholder="Enter your PIN" pattern="[0-9]{8}" minlength="8" maxlength="8" inputmode="numeric" required>
                </div>
                
                <button type="submit" class="btn-primary">ACCESS SYSTEM</button>
            </form>
            
            <div class="login-footer">
                AUTHORIZED PERSONNEL ONLY
            </div>
            <div id="installPrompt" style="margin-top:12px; text-align:center; border:1px solid rgba(255,255,255,0.08); padding:10px; border-radius:8px;">
                <div id="installStatus" class="resource-details" style="margin-bottom:6px;"></div>
                <button id="installButton" class="btn-primary" type="button" style="display:none;">Install App</button>
                <div id="installMessage" class="resource-details" style="margin-top:8px;"></div>
            </div>
        </div>
    </div>

    <!-- Main Application -->
    <div id="appScreen" class="app-container" style="display: none;">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <div class="logo-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                        </svg>
                    </div>
                    <div>
                        <h1>EVENT CMD</h1>
                        <p id="userRole">USER</p>
                    </div>
                </div>
                <div class="user-info">
                    ID: <span id="currentUserId"></span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <button class="nav-item active" data-view="dashboard">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                    </svg>
                    Dashboard
                </button>
                <button class="nav-item" data-view="events" data-privileged="true">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                    Activity Planning
                </button>
                <button class="nav-item" data-view="inprocessing" data-privileged="true">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                    </svg>
                    Inprocessing
                </button>
                <button class="nav-item" data-view="outprocessing" data-privileged="true">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 12h18"></path>
                        <path d="M12 3v18"></path>
                    </svg>
                    Outprocessing
                </button>
                <button class="nav-item" data-view="billeting" data-privileged="true">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 21h18"></path>
                        <path d="M5 21V8l7-5 7 5v13"></path>
                        <path d="M9 21v-6h6v6"></path>
                    </svg>
                    Billeting Planning
                </button>
                <button class="nav-item" data-view="orgchart">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="5" r="2"></circle>
                        <circle cx="6" cy="12" r="2"></circle>
                        <circle cx="18" cy="12" r="2"></circle>
                        <circle cx="12" cy="19" r="2"></circle>
                        <line x1="12" y1="7" x2="6" y2="10"></line>
                        <line x1="12" y1="7" x2="18" y2="10"></line>
                        <line x1="6" y1="14" x2="12" y2="17"></line>
                        <line x1="18" y1="14" x2="12" y2="17"></line>
                    </svg>
                    Org Chart
                </button>
                <button class="nav-item" data-view="assets" data-privileged="true">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                    </svg>
                    Assets &amp; Vehicles
                </button>
                <button class="nav-item" data-view="personnel" data-privileged="true">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                    Personnel &amp; Assignments
                </button>
                <button class="nav-item" data-view="roster" data-privileged="true">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="8" y1="9" x2="16" y2="9"></line>
                        <line x1="8" y1="13" x2="16" y2="13"></line>
                        <line x1="8" y1="17" x2="13" y2="17"></line>
                    </svg>
                    Event Roster
                </button>
                <button class="nav-item" data-view="locations" data-privileged="true">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 1 1 18 0z"></path>

                    </svg>
                    Locations
                </button>
                <button class="nav-item" data-view="schedule">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                    Schedule
                </button>
                <button class="nav-item" data-view="communications" data-privileged="true">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                    </svg>
                    Communications
                </button>
                <button class="nav-item" data-view="support" data-privileged="true">

                        <path d="M12 8v4"></path>
                        <path d="M12 16h.01"></path>
                    </svg>
                    Support Ticket
                </button>
                <button class="nav-item" data-view="log" data-privileged="true">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="8" y1="13" x2="16" y2="13"></line>
                        <line x1="8" y1="17" x2="16" y2="17"></line>
                    </svg>
                    Log
                </button>
                <button class="nav-item" data-view="reports" data-privileged="true">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="4" y1="19" x2="20" y2="19"></line>
                        <rect x="6" y="10" width="3" height="7"></rect>
                        <rect x="11" y1="6" width="3" height="11"></rect>
                        <rect x="16" y1="13" width="3" height="4"></rect>
                    </svg>
                    Reports
                </button>
            </nav>

            <div class="sidebar-footer">
                <button class="nav-item" data-view="admin">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c0 .66.26 1.3.73 1.77.47.47 1.11.73 1.77.73H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                    Admin
                </button>
                <button id="logoutBtn" class="btn-secondary">LOGOUT</button>
            </div>
        </aside>

        <div id="sidebarOverlay" class="sidebar-overlay"></div>

        <!-- Main Content -->
        <main class="main-content">
            <div class="mobile-topbar">
                <button id="mobileMenuBtn" class="hamburger-btn" aria-label="Open menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <div class="mobile-title">EVENT CMD</div>
            </div>
            <div id="contentArea">
                <!-- Content will be loaded here dynamically -->
            </div>
        </main>
    </div>

    <!-- Modal Container -->
    <div id="modalContainer"></div>

    <!-- Loading Indicator -->
    <div id="loadingIndicator" style="display: none;">
        <div class="loading-spinner">LOADING...</div>
    </div>

    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <!-- App Scripts -->
    <script src="./js/config.js?v=20260204d"></script>
    <script src="./js/supabase-client.js?v=20260415m"></script>
    <script src="./js/components.js?v=20260415r"></script>
    <script src="./js/app.js?v=20260415x"></script>
    <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js')
        .then(reg => console.log('Service Worker registered', reg.scope))
        .catch(err => console.log('Service Worker registration failed:', err));
    }

    let deferredPrompt = null;
    const installDiv = document.getElementById('installPrompt');
    const installBtn = document.getElementById('installButton');
    const installMsg = document.getElementById('installMessage');
    const isiOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

    // Default state: show container, hide button until prompt available
    if (installDiv) installDiv.style.display = 'block';
    if (installBtn) installBtn.style.display = 'none';
    if (installMsg) installMsg.textContent = '';

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (installDiv) installDiv.style.display = 'block';
      if (installBtn) installBtn.style.display = 'inline-block';
      if (installMsg) installMsg.textContent = 'Tap Install to add the app to your home screen.';
    });

    if (installBtn) {
      installBtn.addEventListener('click', async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log('Install prompt outcome:', outcome);
        deferredPrompt = null;
        installDiv.style.display = 'none';
      });
    }

    // iOS never fires beforeinstallprompt; show instructions
    if (isiOS && !isStandalone && installDiv) {
      installDiv.style.display = 'block';
      if (installMsg) {
        installMsg.textContent = 'On iPhone/iPad: tap Share, then “Add to Home Screen”.';
      }
      if (installBtn) installBtn.style.display = 'none';
    }

    // Fallback: if no prompt after a few seconds, show guidance
    setTimeout(() => {
      if (!deferredPrompt && !isiOS && !isStandalone && installDiv) {
        installDiv.style.display = 'block';
        if (installMsg) {
          installMsg.textContent = 'In your browser menu, choose “Install app” or “Add to Home screen”.';
        }
        if (installBtn) installBtn.style.display = 'none';
      }
    }, 4000);

    // Diagnostics: check manifest/icon reachability to explain missing prompt
    (async () => {
      try {
        const manifestResp = await fetch('./manifest.json');
        console.log('Manifest fetch', manifestResp.status);
        const icon192 = await fetch('./icons/icon-192.png');
        console.log('icon-192 fetch', icon192.status);
        const icon512 = await fetch('./icons/icon-512.png');
        console.log('icon-512 fetch', icon512.status);
      } catch (err) {
        console.log('PWA diagnostics failed:', err);
      }
    })();
    </script>
</body>
</html>
